[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dm-nl2sql-core"
version = "0.4.0"
description = "选表、描述、同步索引、MCP问答：达梦NL2SQL核心版"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mcp>=1.20,<2", "httpx>=0.28,<1", "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2", "faiss-cpu>=1.10,<2", "numpy>=2.2,<3",
  "sqlglot>=27,<29", "tzdata>=2025.2", "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dameng = ["dmPython>=2.5,<3"]
qa = ["langchain>=1.0,<2", "langchain-openai>=1.0,<2"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[project.scripts]
dm-nl2sql = "dm_core.cli:main"
dm-mcp = "dm_core.mcp:main"
dm-admin-mcp = "dm_core.admin_mcp:main"
dm-qa = "dm_core.qa:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dm_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
